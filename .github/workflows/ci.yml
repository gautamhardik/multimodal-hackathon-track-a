name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # API contract, model fingerprints, SHAP additivity, security headers/limits, vendored-library integrity.
      - run: python -m pytest backend/tests -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t coronary-risk-explorer .
      - name: Smoke-test the container
        run: |
          docker run -d --name cre -p 8000:8000 coronary-risk-explorer
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' cre)" = healthy ] && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/example-patients \
            | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin)['patients'][0]['features']))" > patient.json
          curl -fsS -X POST -H 'Content-Type: application/json' --data @patient.json http://127.0.0.1:8000/predict > /dev/null
          curl -fsS -o /dev/null http://127.0.0.1:8000/app.html
      - if: always()
        run: docker logs cre || true
